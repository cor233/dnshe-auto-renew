name: 仓库保活

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: 创建标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create keepalive --color cccccc --description "自动保活" --repo ${{ github.repository }} 2>/dev/null || true

      - name: 创建保活 Issue
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "keepalive: $DATE" \
            --body "自动保活，防止 Actions 被暂停。" \
            --label keepalive)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 关闭保活 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ steps.create.outputs.url }} --reason completed

      - name: 清理旧 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --repo ${{ github.repository }} \
            --label keepalive \
            --state open \
            --limit 100 \
            --json number,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].number' \
          | while read -r num; do
              gh issue close "$num" --repo ${{ github.repository }} --reason completed
            done
