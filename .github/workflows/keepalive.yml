name: 仓库保活

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 创建并关闭保活 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh issue create \
            --repo ${{ github.repository }} \
            --title "keepalive: $DATE" \
            --body "自动保活，防止 Actions 被暂停。" \
            --label keepalive \
            --close-reason completed
