name: DNSHE 域名自动续期

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行续期
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          RENEW_DAYS_BEFORE: ${{ vars.RENEW_DAYS_BEFORE || '30' }}
        run: python dnshe_renew.py
