name: DNSHE 域名自动续期

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '模拟运行（不实际续期）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行续期
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          RENEW_DAYS_BEFORE: ${{ vars.RENEW_DAYS_BEFORE || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python dnshe_renew.py

      - name: 失败告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '❌ DNSHE 域名续期失败';
            const body = `工作流运行失败，请检查日志: ${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['dnshe', 'auto-renew', 'alert']
            });
